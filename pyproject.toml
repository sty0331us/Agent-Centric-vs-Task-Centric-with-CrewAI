[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-dish-crewai"
version = "1.0.0"
description = "Production-grade CrewAI demo contrasting agent-centric vs task-centric tool assignment for a restaurant customer-service chatbot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Daily Dish Engineering" },
]
keywords = [
  "crewai",
  "multi-agent",
  "agent-centric",
  "task-centric",
  "customer-service",
  "rag",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "crewai>=0.95.0",
  "crewai-tools>=0.17.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]
pdf = [
  "reportlab>=4.2.0",
]

[project.scripts]
daily-dish = "daily_dish.cli:main"

[project.urls]
Homepage = "https://github.com/example/Agent-Centric-vs-Task-Centric-with-CrewAI"
Documentation = "https://github.com/example/Agent-Centric-vs-Task-Centric-with-CrewAI#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_dish"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/data",
  "/tests",
  "/README.md",
  "/scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["daily_dish"]
